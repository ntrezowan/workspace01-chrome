<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace01 – parked workspace</title>
<style>
  html { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  p { margin: 0 0 16px; color: GrayText; line-height: 1.45; }
  button { min-height: 34px; padding: 0 14px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 8px; background: color-mix(in srgb, CanvasText 7%, Canvas); color: CanvasText; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: color-mix(in srgb, CanvasText 12%, Canvas); }
</style>
</head>
<body>
<main>
  <h1>Parked workspace: <span id="ws-name">…</span></h1>
  <p>Workspace01 keeps this workspace's tabs here while another one is active. Leave this window alone and use the Workspace01 toolbar button to switch. Closing this window closes the workspace's tabs; they can still be re-opened from the saved list.</p>
  <button id="switch" type="button">Switch to this workspace</button>
</main>
<script src="park.js"></script>
</body>
</html>
